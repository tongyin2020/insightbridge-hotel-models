# director.insightbridge.global
# Host-level nginx vhost for same-host deployment
# Upstream:
#   DirectorAI API + frontend routes: 127.0.0.1:8001

server {
    listen 80;
    server_name director.insightbridge.global;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name director.insightbridge.global;

    ssl_certificate /etc/letsencrypt/live/director.insightbridge.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/director.insightbridge.global/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10m;
    }

    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
